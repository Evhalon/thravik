project_id = "redent-sync-foundation"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 100
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["redent://account/callback", "redent://account/callback?**"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.email.template.confirmation]
subject = "Confirm your Thravik account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.magic_link]
subject = "Your Thravik sign-in code"
content_path = "./supabase/templates/magic_link.html"
[auth.email.template.reauthentication]
subject = "Verify your Thravik sign-in"
content_path = "./supabase/templates/reauthentication.html"
[auth.email.template.invite]
subject = "You’re invited to Thravik"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "Reset your Thravik account password"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.email_change]
subject = "Confirm your new Thravik email"
content_path = "./supabase/templates/email_change.html"
