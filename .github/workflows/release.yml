name: Release Thravik

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thravik-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: sh scripts/import-signing-identity.sh

      - name: Build signed release
        env:
          REQUIRE_SIGNING: '1'
          MACOS_BROWSER_PROFILE_BASE64: ${{ secrets.MACOS_BROWSER_PROFILE_BASE64 }}
        run: |
          if [ -n "$MACOS_BROWSER_PROFILE_BASE64" ]; then
            profile="$RUNNER_TEMP/browser.provisionprofile"
            printf %s "$MACOS_BROWSER_PROFILE_BASE64" | base64 --decode > "$profile"
            export PROVISIONING_PROFILE="$profile" REQUIRE_PASSKEYS=1
          fi
          version="0.1.${GITHUB_RUN_NUMBER}"
          sh scripts/set-version.sh "$version" "$GITHUB_RUN_NUMBER"
          make app
          sh scripts/package-release.sh dist/Thravik.app dist/Thravik-macOS.dmg
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: sh scripts/notarize-release.sh dist/Thravik-macOS.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/Thravik-macOS.dmg \
            --target "$GITHUB_SHA" --title "Thravik ${VERSION}" --generate-notes
