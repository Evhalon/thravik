name: Release Thravik

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thravik-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Run quality gates
        run: make verify

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: sh scripts/import-signing-identity.sh

      - name: Build signed release
        env:
          REQUIRE_SIGNING: '1'
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          sh scripts/set-version.sh "$version" "$GITHUB_RUN_NUMBER"
          make release
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: sh scripts/notarize-release.sh dist/Thravik-macOS.dmg

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/Thravik-macOS.dmg \
            --target "$GITHUB_SHA" --title "Thravik ${VERSION}" --generate-notes
